# Revisa cada cambio y, si todo pasa, publica la app en GitHub Pages (rama gh-pages).
# La dirección es https://4mpj88dbtn-hash.github.io/Boveda-/ y siempre muestra el último avance.
name: Revisión y publicación

on:
  push:
    branches: [main, "fase-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: revision-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  codigo:
    name: Código, tipos y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Revisión de estilo
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas unitarias
        run: npm test
      - name: Compilación
        run: npm run build

  flujo-completo:
    name: Flujo completo en navegador
    needs: codigo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar el navegador de pruebas
        run: npx playwright install --with-deps chromium
      - name: Pruebas de flujo completo
        run: npm run test:e2e

  publicar:
    name: Publicar en GitHub Pages
    needs: [codigo, flujo-completo]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publicar
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Subir la app a la rama gh-pages (conserva los datos de mercado)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/publicar-gh-pages.sh app out "Publicación de ${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
          echo "::notice::App publicada desde ${GITHUB_REF_NAME}. Dirección: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
