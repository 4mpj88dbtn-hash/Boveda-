# Revisa cada cambio: estilo, tipos, pruebas, compilación, reglas de la base y flujo completo.
name: Revisión

on:
  push:
    branches: [main, "fase-*"]
  pull_request:

concurrency:
  group: revision-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  codigo:
    name: Código, tipos y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Revisión de estilo
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas unitarias
        run: npm test
      - name: Compilación
        run: npm run build

  flujo-completo:
    name: Base de datos y flujo completo
    needs: codigo
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Levantar Supabase local
        run: npx supabase start
      - name: Pruebas de reglas de acceso (base de datos)
        run: npx supabase test db
      - name: Usar las claves de la base local
        # Son las claves por defecto de la base local de pruebas, no las de tu proyecto.
        run: |
          npx supabase status -o env > supabase.env
          valor() { grep "^$1=" supabase.env | cut -d= -f2- | tr -d '"'; }
          {
            echo "SUPABASE_URL=$(valor API_URL)"
            echo "SUPABASE_PUBLISHABLE_KEY=$(valor PUBLISHABLE_KEY)"
            echo "SUPABASE_SECRET_KEY=$(valor SECRET_KEY)"
          } >> "$GITHUB_ENV"
      - name: Instalar el navegador de pruebas
        run: npx playwright install --with-deps chromium
      - name: Pruebas de flujo completo
        run: npm run test:e2e
