# Aplica los cambios de la base de datos (supabase/migrations) en tu proyecto de Supabase.
# Corre solo al fusionar a main, o a mano desde la pestaña Actions → "Migraciones" → Run workflow.
# Necesita 3 secretos en GitHub (ver README): SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD
# y SUPABASE_PROJECT_ID.
name: Migraciones

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

concurrency:
  group: migraciones
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  aplicar:
    name: Aplicar migraciones en Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Revisar que los secretos estén configurados
        id: secretos
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::warning::Faltan los secretos de Supabase en GitHub (ver README, sección Publicar la app). No se aplicó nada."
            echo "listos=false" >> "$GITHUB_OUTPUT"
          else
            echo "listos=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.secretos.outputs.listos == 'true'
      - uses: actions/setup-node@v6
        if: steps.secretos.outputs.listos == 'true'
        with:
          node-version: 22
      - name: Conectar con tu proyecto
        if: steps.secretos.outputs.listos == 'true'
        run: npx --yes supabase@3.0.0 link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Aplicar migraciones
        if: steps.secretos.outputs.listos == 'true'
        run: npx --yes supabase@3.0.0 db push --remote --yes --password "$SUPABASE_DB_PASSWORD"
